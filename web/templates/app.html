<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipForge — App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #09090b;
            color: #e4e4e7;
            min-height: 100vh;
        }

        /* Nav */
        nav {
            position: sticky; top: 0; z-index: 100;
            padding: 12px 32px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(9,9,11,0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .logo {
            font-size: 1.3em; font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-right { display: flex; gap: 16px; align-items: center; }
        .channel-status {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 14px; border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.85em;
        }
        .channel-status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ef4444;
        }
        .channel-status.connected .dot { background: #38ef7d; }
        .channel-btn {
            padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85em;
            border: none; cursor: pointer; transition: all 0.2s;
        }
        .channel-btn.connect {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            color: white;
        }
        .channel-btn.disconnect {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
        }
        .channel-btn:hover { transform: translateY(-1px); }
        .channel-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            min-height: calc(100vh - 57px);
        }

        /* Sidebar */
        .sidebar {
            padding: 24px;
            border-right: 1px solid rgba(255,255,255,0.06);
            overflow-y: auto;
            max-height: calc(100vh - 57px);
        }
        .sidebar h2 {
            font-size: 1em; font-weight: 700; color: #818cf8;
            text-transform: uppercase; letter-spacing: 0.05em;
            margin-bottom: 20px;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block; font-size: 0.82em; font-weight: 600; color: #a1a1aa;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .field input[type="url"], .field input[type="number"],
        .field input[type="datetime-local"], .field select {
            width: 100%; padding: 10px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: #e4e4e7;
            font-size: 0.95em; font-family: inherit;
            transition: border-color 0.2s;
        }
        .field input:focus, .field select:focus {
            outline: none; border-color: #818cf8;
        }
        .field input::placeholder { color: #52525b; }
        .field-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .divider {
            height: 1px; background: rgba(255,255,255,0.06);
            margin: 20px 0;
        }

        /* Toggle */
        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .toggle-row span { font-size: 0.9em; }
        .toggle {
            width: 44px; height: 24px; border-radius: 12px;
            background: #27272a; border: none; cursor: pointer;
            position: relative; transition: background 0.2s;
        }
        .toggle.on { background: #818cf8; }
        .toggle::after {
            content: ''; position: absolute;
            top: 3px; left: 3px; width: 18px; height: 18px;
            border-radius: 50%; background: white;
            transition: transform 0.2s;
        }
        .toggle.on::after { transform: translateX(20px); }

        /* Buttons */
        .generate-btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 1em; font-weight: 700; font-family: inherit;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            color: white; cursor: pointer;
            transition: all 0.2s; margin-top: 8px;
        }
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(129,140,248,0.3);
        }
        .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .generate-btn:active:not(:disabled) { transform: translateY(0); }

        /* Main Content */
        .main {
            padding: 24px 32px;
            overflow-y: auto;
            max-height: calc(100vh - 57px);
        }

        /* Welcome state */
        .welcome {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 60vh; text-align: center;
        }
        .welcome-icon { font-size: 4em; margin-bottom: 20px; opacity: 0.5; }
        .welcome h2 { font-size: 1.8em; font-weight: 800; margin-bottom: 12px; }
        .welcome p { color: #71717a; font-size: 1.05em; max-width: 500px; }

        /* Progress */
        .progress-section { display: none; margin-bottom: 24px; }
        .progress-section.active { display: block; }
        .progress-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .progress-header h3 { font-size: 1.1em; }
        .progress-header .percent { font-size: 1.4em; font-weight: 800; color: #818cf8; }
        .progress-track {
            height: 6px; background: rgba(255,255,255,0.06);
            border-radius: 3px; overflow: hidden; margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            transition: width 0.4s ease; width: 0%;
        }
        .progress-step { font-size: 0.85em; color: #71717a; }

        /* Log */
        .log-panel {
            display: none;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
            max-height: 200px; overflow-y: auto;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.8em; line-height: 1.7; color: #71717a;
            margin-bottom: 24px;
        }
        .log-panel.active { display: block; }
        .log-panel .log-ok { color: #38ef7d; }
        .log-panel .log-info { color: #818cf8; }
        .log-panel .log-err { color: #ef4444; }

        /* Clips Grid */
        .clips-section { display: none; }
        .clips-section.active { display: block; }
        .clips-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .clips-header h2 { font-size: 1.3em; font-weight: 800; }
        .clips-actions { display: flex; gap: 10px; }
        .clips-actions button {
            padding: 8px 18px; border-radius: 8px; font-size: 0.85em;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            font-family: inherit; border: none;
        }
        .btn-upload {
            background: linear-gradient(135deg, #38ef7d, #11998e);
            color: white;
        }
        .btn-download-all {
            background: rgba(255,255,255,0.06); color: #a1a1aa;
            border: 1px solid rgba(255,255,255,0.1) !important;
        }
        .clips-actions button:hover { transform: translateY(-1px); }
        .clips-actions button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .clips-grid { display: flex; flex-direction: column; gap: 16px; }
        .clip-card {
            display: flex; gap: 16px; align-items: center;
            background: rgba(24,24,27,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 16px;
            transition: all 0.2s;
        }
        .clip-card:hover {
            border-color: rgba(129,140,248,0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .clip-preview {
            width: 90px; height: 160px; border-radius: 10px;
            background: #18181b; overflow: hidden; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .clip-preview video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .clip-meta { flex: 1; }
        .clip-meta h4 { font-size: 1em; font-weight: 700; margin-bottom: 6px; }
        .clip-stats {
            display: flex; gap: 16px; margin-bottom: 8px;
        }
        .clip-stats span {
            font-size: 0.8em; color: #71717a;
            display: flex; align-items: center; gap: 4px;
        }
        .clip-stats .score {
            color: #c084fc; font-weight: 600;
        }
        .clip-text {
            font-size: 0.85em; color: #52525b; line-height: 1.5;
            margin-bottom: 10px;
        }
        .clip-btns { display: flex; gap: 8px; }
        .clip-btns button, .clip-btns a {
            padding: 6px 14px; border-radius: 6px; font-size: 0.8em;
            font-weight: 600; cursor: pointer; transition: all 0.15s;
            font-family: inherit; border: none; text-decoration: none;
        }
        .btn-play { background: rgba(129,140,248,0.15); color: #818cf8; }
        .btn-dl { background: rgba(255,255,255,0.06); color: #a1a1aa; border: 1px solid rgba(255,255,255,0.1) !important; }
        .clip-btns button:hover, .clip-btns a:hover { transform: translateY(-1px); }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px; z-index: 200;
            padding: 14px 24px; border-radius: 12px;
            background: #18181b; border: 1px solid rgba(255,255,255,0.1);
            color: #e4e4e7; font-size: 0.9em; font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { border-color: rgba(56,239,125,0.3); }
        .toast.error { border-color: rgba(239,68,68,0.3); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }

        @media (max-width: 900px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar { max-height: none; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.06); }
            .main { max-height: none; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">ClipForge</a>
        <div class="nav-right">
            <div class="channel-status" id="channelStatus">
                <span class="dot"></span>
                <span id="channelLabel">Not connected</span>
            </div>
            <button class="channel-btn connect" id="channelBtn" onclick="toggleChannel()">Connect YouTube</button>
        </div>
    </nav>

    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Settings</h2>

            <div class="field">
                <label>YouTube URL</label>
                <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." />
            </div>

            <div class="field-row">
                <div class="field">
                    <label>Number of Clips</label>
                    <input type="number" id="numClips" value="5" min="1" max="20" />
                </div>
                <div class="field">
                    <label>Max Duration (sec)</label>
                    <input type="number" id="maxDuration" value="30" min="5" max="60" />
                </div>
            </div>

            <div class="field-row">
                <div class="field">
                    <label>AI Model</label>
                    <select id="model">
                        <option value="tiny">Tiny (fastest)</option>
                        <option value="base" selected>Base (balanced)</option>
                        <option value="small">Small (better)</option>
                        <option value="medium">Medium (best)</option>
                    </select>
                </div>
                <div class="field">
                    <label>Caption Position</label>
                    <select id="captionPos">
                        <option value="center" selected>Center</option>
                        <option value="bottom">Bottom</option>
                    </select>
                </div>
            </div>

            <div class="divider"></div>

            <div class="toggle-row">
                <span>Auto-upload to YouTube</span>
                <button class="toggle" id="toggleUpload" onclick="this.classList.toggle('on')"></button>
            </div>

            <div id="uploadOpts" style="display:none">
                <div class="field">
                    <label>Privacy</label>
                    <select id="privacy">
                        <option value="unlisted" selected>Unlisted</option>
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                <div class="toggle-row">
                    <span>Schedule uploads</span>
                    <button class="toggle" id="toggleSchedule" onclick="this.classList.toggle('on');document.getElementById('scheduleOpts').style.display=this.classList.contains('on')?'block':'none'"></button>
                </div>
                <div id="scheduleOpts" style="display:none">
                    <div class="field-row">
                        <div class="field">
                            <label>Interval (min)</label>
                            <input type="number" id="interval" value="180" min="10" max="1440" />
                        </div>
                        <div class="field">
                            <label>Start Time</label>
                            <input type="datetime-local" id="startTime" />
                        </div>
                    </div>
                </div>
            </div>

            <button class="generate-btn" id="btnGenerate" onclick="startGenerate()">
                Generate Clips
            </button>
        </div>

        <!-- Main Content -->
        <div class="main">
            <!-- Welcome -->
            <div class="welcome" id="welcomeState">
                <div class="welcome-icon">🎬</div>
                <h2>Paste a YouTube URL</h2>
                <p>Enter a video link in the sidebar and click "Generate Clips" to get started. The AI will find the best moments and create viral Shorts for you.</p>
            </div>

            <!-- Progress -->
            <div class="progress-section" id="progressSection">
                <div class="progress-header">
                    <h3 id="progressTitle">Processing...</h3>
                    <span class="percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-step" id="progressStep">Starting...</div>
            </div>

            <!-- Log -->
            <div class="log-panel" id="logPanel"></div>

            <!-- Clips -->
            <div class="clips-section" id="clipsSection">
                <div class="clips-header">
                    <h2>Generated Clips</h2>
                    <div class="clips-actions">
                        <button class="btn-upload" id="btnUpload" onclick="startUpload()" disabled>Upload to YouTube</button>
                        <button class="btn-download-all" id="btnDownloadAll" onclick="downloadAll()" disabled>Download All (.zip)</button>
                    </div>
                </div>
                <div class="clips-grid" id="clipsList"></div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        let currentJobId = null;
        let ws = null;

        // Toggle upload options
        document.getElementById('toggleUpload').addEventListener('click', function() {
            document.getElementById('uploadOpts').style.display = this.classList.contains('on') ? 'block' : 'none';
        });

        // --- Channel ---
        async function checkChannel() {
            try {
                const r = await fetch('/api/channel/status');
                const d = await r.json();
                updateChannelUI(d);
            } catch(e) {}
        }

        function updateChannelUI(info) {
            const el = document.getElementById('channelStatus');
            const label = document.getElementById('channelLabel');
            const btn = document.getElementById('channelBtn');
            if (info.connected) {
                el.classList.add('connected');
                label.textContent = info.title;
                btn.textContent = 'Disconnect';
                btn.className = 'channel-btn disconnect';
            } else {
                el.classList.remove('connected');
                label.textContent = 'Not connected';
                btn.textContent = 'Connect YouTube';
                btn.className = 'channel-btn connect';
            }
        }

        async function toggleChannel() {
            const btn = document.getElementById('channelBtn');
            if (btn.classList.contains('connect')) {
                btn.disabled = true;
                btn.textContent = 'Connecting...';
                try {
                    const r = await fetch('/api/channel/connect', { method: 'POST' });
                    const d = await r.json();
                    if (d.connected) {
                        updateChannelUI(d);
                        toast('Connected: ' + d.title, 'success');
                    } else {
                        toast(d.error || 'Connection failed', 'error');
                        btn.disabled = false;
                        btn.textContent = 'Connect YouTube';
                    }
                } catch(e) {
                    toast('Connection error: ' + e.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Connect YouTube';
                }
            } else {
                await fetch('/api/channel/disconnect', { method: 'POST' });
                updateChannelUI({ connected: false });
                toast('Channel disconnected', 'success');
            }
        }

        // --- Toast ---
        function toast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + (type || '') + ' show';
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        // --- Log ---
        function addLog(text, type) {
            const el = document.getElementById('logPanel');
            el.classList.add('active');
            const line = document.createElement('div');
            if (type === 'success') line.className = 'log-ok';
            else if (type === 'info') line.className = 'log-info';
            else if (type === 'error') line.className = 'log-err';
            line.textContent = text;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
        }

        // --- Progress ---
        function updateProgress(pct, step, status) {
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPercent').textContent = pct + '%';
            if (step) document.getElementById('progressTitle').textContent = step;
            if (status) document.getElementById('progressStep').textContent = status;
        }

        // --- Clips ---
        function showClips(clips) {
            if (!clips || !clips.length) return;
            document.getElementById('welcomeState').style.display = 'none';
            document.getElementById('clipsSection').classList.add('active');
            document.getElementById('btnUpload').disabled = false;
            document.getElementById('btnDownloadAll').disabled = false;

            const list = document.getElementById('clipsList');
            list.innerHTML = '';
            clips.forEach((clip, i) => {
                const mb = (clip.size / (1024*1024)).toFixed(1);
                const card = document.createElement('div');
                card.className = 'clip-card';
                card.innerHTML = `
                    <div class="clip-preview">
                        <video src="${clip.url}" muted preload="metadata"></video>
                    </div>
                    <div class="clip-meta">
                        <h4>Clip ${i+1}</h4>
                        <div class="clip-stats">
                            <span>${clip.duration}s</span>
                            <span class="score">★ ${clip.score}</span>
                            <span>${mb} MB</span>
                        </div>
                        <div class="clip-text">${clip.text.substring(0,120)}${clip.text.length>120?'...':''}</div>
                        <div class="clip-btns">
                            <button class="btn-play" onclick="playClip('${clip.url}')">▶ Play</button>
                            <a class="btn-dl" href="${clip.url}" download>↓ Download</a>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function playClip(url) {
            const w = window.open('','_blank');
            w.document.write('<html><head><title>Preview</title><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh}video{max-height:90vh;max-width:90vw}</style></head><body><video src="'+url+'" controls autoplay></video></body></html>');
        }

        // --- Generate ---
        async function startGenerate() {
            const url = document.getElementById('url').value.trim();
            if (!url) { toast('Enter a YouTube URL', 'error'); return; }

            document.getElementById('logPanel').innerHTML = '';
            document.getElementById('logPanel').classList.remove('active');
            document.getElementById('clipsSection').classList.remove('active');
            document.getElementById('welcomeState').style.display = 'none';
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('btnUpload').disabled = true;
            document.getElementById('btnDownloadAll').disabled = true;
            updateProgress(0, 'Starting...', 'Preparing...');

            const fd = new FormData();
            fd.append('url', url);
            fd.append('clips', document.getElementById('numClips').value);
            fd.append('duration', document.getElementById('maxDuration').value);
            fd.append('model', document.getElementById('model').value);
            fd.append('caption_pos', document.getElementById('captionPos').value);

            try {
                const r = await fetch('/api/generate', { method: 'POST', body: fd });
                const d = await r.json();
                if (d.detail) { toast(d.detail, 'error'); document.getElementById('btnGenerate').disabled = false; return; }
                currentJobId = d.job_id;
                addLog('Job started: ' + currentJobId, 'info');
                connectWS(currentJobId);
            } catch(e) {
                toast('Error: ' + e.message, 'error');
                document.getElementById('btnGenerate').disabled = false;
            }
        }

        function connectWS(jobId) {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/job/${jobId}`);

            ws.onopen = () => addLog('Connected for live updates', 'info');

            ws.onmessage = (ev) => {
                try {
                    const d = JSON.parse(ev.data);
                    updateProgress(d.progress, d.step, d.status);
                    if (d.logs && d.logs.length > 0) {
                        d.logs.forEach(l => {
                            let t = '';
                            if (l.includes('Done') || l.includes('Exported')) t = 'success';
                            else if (l.includes('Error') || l.includes('Failed')) t = 'error';
                            else t = 'info';
                            addLog(l, t);
                        });
                    }
                    if (d.clips && d.clips.length > 0) showClips(d.clips);
                    if (d.status === 'completed') {
                        addLog('All done!', 'success');
                        document.getElementById('btnGenerate').disabled = false;
                        toast('Clips generated!', 'success');
                        ws.close();
                    } else if (d.status === 'failed') {
                        addLog('Failed: ' + (d.error || 'Unknown'), 'error');
                        document.getElementById('btnGenerate').disabled = false;
                        toast('Generation failed', 'error');
                        ws.close();
                    }
                } catch(e) {}
            };

            ws.onerror = () => {
                addLog('WebSocket error — using polling', 'error');
                ws = null;
                pollJob(jobId);
            };

            ws.onclose = () => { document.getElementById('btnGenerate').disabled = false; };
        }

        function pollJob(jobId) {
            let lastLog = 0;
            const iv = setInterval(async () => {
                try {
                    const r = await fetch('/api/job/' + jobId);
                    const d = await r.json();
                    updateProgress(d.progress, d.step, d.status);
                    if (d.logs && d.logs.length > lastLog) {
                        for (let i = lastLog; i < d.logs.length; i++) {
                            const l = d.logs[i];
                            let t = '';
                            if (l.includes('Done') || l.includes('Exported')) t = 'success';
                            else if (l.includes('Error') || l.includes('Failed')) t = 'error';
                            else t = 'info';
                            addLog(l, t);
                        }
                        lastLog = d.logs.length;
                    }
                    if (d.clips && d.clips.length > 0) showClips(d.clips);
                    if (d.status === 'completed' || d.status === 'failed') {
                        clearInterval(iv);
                        document.getElementById('btnGenerate').disabled = false;
                        if (d.status === 'completed') { addLog('Done!', 'success'); toast('Clips generated!', 'success'); }
                        else { addLog('Failed: ' + (d.error||'Unknown'), 'error'); toast('Failed', 'error'); }
                    }
                } catch(e) {}
            }, 2000);
        }

        // --- Upload ---
        async function startUpload() {
            if (!currentJobId) { toast('Generate clips first', 'error'); return; }
            document.getElementById('btnUpload').disabled = true;
            addLog('Starting upload...', 'info');
            const fd = new FormData();
            fd.append('privacy', document.getElementById('privacy').value);
            fd.append('schedule', document.getElementById('toggleSchedule').classList.contains('on'));
            fd.append('interval', document.getElementById('interval').value);
            const st = document.getElementById('startTime').value;
            if (st) fd.append('start_time', new Date(st).toISOString());
            try {
                const r = await fetch('/api/upload/' + currentJobId, { method: 'POST', body: fd });
                const d = await r.json();
                addLog('Upload started for ' + d.clips + ' clips', 'success');
                toast('Upload started!', 'success');
            } catch(e) {
                addLog('Upload error: ' + e.message, 'error');
                toast('Upload failed', 'error');
                document.getElementById('btnUpload').disabled = false;
            }
        }

        function downloadAll() {
            if (!currentJobId) return;
            window.open('/api/download-all/' + currentJobId, '_blank');
        }

        // Init
        checkChannel();
    </script>
</body>
</html>
