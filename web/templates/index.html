<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Maker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0 20px; }
        .header h1 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: #888; font-size: 1.05em; }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3e;
        }
        .card h2 {
            font-size: 1.15em;
            color: #667eea;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        input[type="text"], input[type="number"], input[type="url"],
        input[type="datetime-local"], select {
            width: 100%;
            padding: 10px 14px;
            background: #12121e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.95em;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        input::placeholder { color: #555; }
        .checkbox-row { display: flex; gap: 20px; margin-bottom: 12px; }
        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.95em;
        }
        input[type="checkbox"] {
            accent-color: #667eea;
            width: 16px;
            height: 16px;
        }
        .btn-group { display: flex; gap: 12px; margin-top: 18px; }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(102,126,234,0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(56,239,125,0.3);
        }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-outline {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
        }
        .btn-outline:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
        }
        .btn-sm { padding: 6px 14px; font-size: 0.85em; }
        .progress-container { display: none; margin-bottom: 20px; }
        .progress-container.active { display: block; }
        .progress-bar-bg {
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            color: #888;
        }
        .log-box {
            background: #0a0a14;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 14px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.6;
            color: #aaa;
            display: none;
        }
        .log-box.active { display: block; }
        .log-box .log-line { white-space: pre-wrap; }
        .log-box .log-line.info { color: #667eea; }
        .log-box .log-line.success { color: #38ef7d; }
        .log-box .log-line.error { color: #e74c3c; }
        .clips-grid { display: none; margin-top: 20px; }
        .clips-grid.active { display: block; }
        .clips-grid h3 { color: #667eea; margin-bottom: 14px; }
        .clip-card {
            background: #12121e;
            border: 1px solid #2a2a3e;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .clip-thumb {
            width: 80px;
            height: 140px;
            background: #222;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            flex-shrink: 0;
            overflow: hidden;
        }
        .clip-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .clip-info { flex: 1; }
        .clip-info h4 { color: #e0e0e0; margin-bottom: 4px; }
        .clip-info p { color: #888; font-size: 0.85em; margin-bottom: 4px; }
        .clip-meta {
            display: flex;
            gap: 12px;
            font-size: 0.8em;
            color: #666;
            margin-bottom: 8px;
        }
        .clip-meta span { display: flex; align-items: center; gap: 4px; }
        .clip-actions { display: flex; gap: 8px; }
        .schedule-section {
            display: none;
            margin-top: 12px;
            padding: 14px;
            background: #12121e;
            border-radius: 8px;
            border: 1px solid #2a2a3e;
        }
        .schedule-section.active { display: block; }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
            .clip-card { flex-direction: column; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a14; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>YouTube Shorts Maker</h1>
            <p>AI-powered clip finder + captioner + uploader</p>
        </div>

        <!-- URL Input -->
        <div class="card">
            <h2>Video Source</h2>
            <div class="form-group">
                <label>YouTube URL</label>
                <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." />
            </div>
        </div>

        <!-- Settings -->
        <div class="card">
            <h2>Clip Settings</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Number of clips</label>
                    <input type="number" id="clips" value="5" min="1" max="20" />
                </div>
                <div class="form-group">
                    <label>Max duration (seconds)</label>
                    <input type="number" id="duration" value="30" min="5" max="60" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Whisper model</label>
                    <select id="model">
                        <option value="tiny">tiny (fastest)</option>
                        <option value="base" selected>base (balanced)</option>
                        <option value="small">small (better)</option>
                        <option value="medium">medium (best)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Caption position</label>
                    <select id="captionPos">
                        <option value="center" selected>center</option>
                        <option value="bottom">bottom</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Upload Settings -->
        <div class="card">
            <h2>Upload Settings</h2>
            <div class="checkbox-row">
                <label>
                    <input type="checkbox" id="enableUpload" />
                    Auto-upload to YouTube Shorts
                </label>
                <label>
                    <input type="checkbox" id="enableSchedule" />
                    Schedule uploads
                </label>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Privacy</label>
                    <select id="privacy">
                        <option value="unlisted" selected>unlisted</option>
                        <option value="public">public</option>
                        <option value="private">private</option>
                    </select>
                </div>
            </div>
            <div class="schedule-section" id="scheduleSection">
                <div class="form-row">
                    <div class="form-group">
                        <label>Interval (minutes)</label>
                        <input type="number" id="interval" value="180" min="10" max="1440" />
                    </div>
                    <div class="form-group">
                        <label>Start time (optional)</label>
                        <input type="datetime-local" id="startTime" />
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="btn-group">
            <button class="btn btn-primary" id="btnGenerate" onclick="startGenerate()">
                Generate Clips
            </button>
            <button class="btn btn-success" id="btnUpload" onclick="startUpload()" disabled>
                Upload to YouTube
            </button>
            <button class="btn btn-outline" id="btnDownloadAll" onclick="downloadAll()" disabled>
                Download All
            </button>
        </div>

        <!-- Progress -->
        <div class="card progress-container" id="progressCard">
            <h2 id="progressStep">Processing...</h2>
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-info">
                <span id="progressPercent">0%</span>
                <span id="progressStatus">Starting...</span>
            </div>
        </div>

        <!-- Log -->
        <div class="log-box" id="logBox"></div>

        <!-- Clips -->
        <div class="clips-grid" id="clipsGrid">
            <h3>Generated Clips</h3>
            <div id="clipsList"></div>
        </div>
    </div>

    <script>
        let currentJobId = null;
        let ws = null;

        document.getElementById('enableSchedule').addEventListener('change', function() {
            document.getElementById('scheduleSection').classList.toggle('active', this.checked);
        });

        function addLog(text, type = '') {
            const logBox = document.getElementById('logBox');
            logBox.classList.add('active');
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            line.textContent = text;
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateProgress(percent, step, status) {
            document.getElementById('progressCard').classList.add('active');
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
            if (step) document.getElementById('progressStep').textContent = step;
            if (status) document.getElementById('progressStatus').textContent = status;
        }

        function showClips(clips) {
            if (!clips || clips.length === 0) return;
            const grid = document.getElementById('clipsGrid');
            const list = document.getElementById('clipsList');
            list.innerHTML = '';
            grid.classList.add('active');
            document.getElementById('btnUpload').disabled = false;
            document.getElementById('btnDownloadAll').disabled = false;

            clips.forEach((clip, i) => {
                const sizeMB = (clip.size / (1024 * 1024)).toFixed(1);
                const card = document.createElement('div');
                card.className = 'clip-card';
                card.innerHTML = `
                    <div class="clip-thumb">
                        <video src="${clip.url}" muted preload="metadata"></video>
                    </div>
                    <div class="clip-info">
                        <h4>Clip ${i + 1}</h4>
                        <div class="clip-meta">
                            <span>${clip.duration}s</span>
                            <span>Score: ${clip.score}</span>
                            <span>${sizeMB} MB</span>
                        </div>
                        <p>${clip.text.substring(0, 100)}${clip.text.length > 100 ? '...' : ''}</p>
                        <div class="clip-actions">
                            <button class="btn btn-sm btn-primary" onclick="playClip('${clip.url}')">Play</button>
                            <a class="btn btn-sm btn-outline" href="${clip.url}" download>Download</a>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function playClip(url) {
            const win = window.open('', '_blank');
            win.document.write(`
                <html><head><title>Clip Preview</title>
                <style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;}
                video{max-height:90vh;max-width:90vw;}</style></head>
                <body><video src="${url}" controls autoplay></video></body></html>
            `);
        }

        async function startGenerate() {
            const url = document.getElementById('url').value.trim();
            if (!url) {
                alert('Please enter a YouTube URL');
                return;
            }

            // Reset UI
            document.getElementById('logBox').innerHTML = '';
            document.getElementById('clipsGrid').classList.remove('active');
            document.getElementById('btnGenerate').disabled = true;
            document.getElementById('btnUpload').disabled = true;
            document.getElementById('btnDownloadAll').disabled = true;
            updateProgress(0, 'Starting...', 'Preparing...');

            const formData = new FormData();
            formData.append('url', url);
            formData.append('clips', document.getElementById('clips').value);
            formData.append('duration', document.getElementById('duration').value);
            formData.append('model', document.getElementById('model').value);
            formData.append('caption_pos', document.getElementById('captionPos').value);

            try {
                const resp = await fetch('/api/generate', { method: 'POST', body: formData });
                const data = await resp.json();

                if (data.detail) {
                    addLog('Error: ' + data.detail, 'error');
                    document.getElementById('btnGenerate').disabled = false;
                    return;
                }

                currentJobId = data.job_id;
                addLog('Job started: ' + currentJobId, 'info');

                // Connect WebSocket for live updates
                connectWS(currentJobId);

            } catch (err) {
                addLog('Error: ' + err.message, 'error');
                document.getElementById('btnGenerate').disabled = false;
            }
        }

        function connectWS(jobId) {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/job/${jobId}`);

            ws.onopen = function() {
                addLog('Connected for live updates', 'info');
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);

                    // Update progress
                    updateProgress(data.progress, data.step, data.status);

                    // Show new logs (server sends only new ones)
                    if (data.logs && data.logs.length > 0) {
                        data.logs.forEach(log => {
                            let type = '';
                            if (log.includes('Done') || log.includes('Exported')) type = 'success';
                            else if (log.includes('Error') || log.includes('Failed')) type = 'error';
                            else if (log.includes('Step') || log.includes('Clip #') || log.includes('Downloading') || log.includes('Transcrib')) type = 'info';
                            addLog(log, type);
                        });
                    }

                    // Show clips
                    if (data.clips && data.clips.length > 0) {
                        showClips(data.clips);
                    }

                    // Done
                    if (data.status === 'completed') {
                        addLog('All done!', 'success');
                        document.getElementById('btnGenerate').disabled = false;
                        ws.close();
                    } else if (data.status === 'failed') {
                        addLog('Failed: ' + (data.error || 'Unknown error'), 'error');
                        document.getElementById('btnGenerate').disabled = false;
                        ws.close();
                    }
                } catch (e) {
                    addLog('Parse error: ' + e.message, 'error');
                }
            };

            ws.onerror = function(err) {
                console.error('WebSocket error:', err);
                // Fallback to polling
                addLog('WebSocket error — falling back to polling...', 'error');
                ws = null;
                pollJobStatus(jobId);
            };

            ws.onclose = function() {
                document.getElementById('btnGenerate').disabled = false;
            };
        }

        // Fallback: poll via HTTP if WebSocket fails
        function pollJobStatus(jobId) {
            let lastLogCount = 0;
            const interval = setInterval(async () => {
                try {
                    const resp = await fetch(`/api/job/${jobId}`);
                    const data = await resp.json();

                    updateProgress(data.progress, data.step, data.status);

                    if (data.logs && data.logs.length > lastLogCount) {
                        for (let i = lastLogCount; i < data.logs.length; i++) {
                            const log = data.logs[i];
                            let type = '';
                            if (log.includes('Done') || log.includes('Exported')) type = 'success';
                            else if (log.includes('Error') || log.includes('Failed')) type = 'error';
                            else if (log.includes('Step') || log.includes('Clip #')) type = 'info';
                            addLog(log, type);
                        }
                        lastLogCount = data.logs.length;
                    }

                    if (data.clips && data.clips.length > 0) {
                        showClips(data.clips);
                    }

                    if (data.status === 'completed' || data.status === 'failed') {
                        clearInterval(interval);
                        if (data.status === 'completed') {
                            addLog('All done!', 'success');
                        } else {
                            addLog('Failed: ' + (data.error || 'Unknown error'), 'error');
                        }
                        document.getElementById('btnGenerate').disabled = false;
                    }
                } catch (e) {
                    // Keep polling
                }
            }, 2000);
        }

        async function startUpload() {
            if (!currentJobId) {
                alert('Generate clips first');
                return;
            }
            document.getElementById('btnUpload').disabled = true;
            addLog('Starting upload...', 'info');

            const formData = new FormData();
            formData.append('privacy', document.getElementById('privacy').value);
            formData.append('schedule', document.getElementById('enableSchedule').checked);
            formData.append('interval', document.getElementById('interval').value);

            const startTime = document.getElementById('startTime').value;
            if (startTime) {
                formData.append('start_time', new Date(startTime).toISOString());
            }

            try {
                const resp = await fetch(`/api/upload/${currentJobId}`, { method: 'POST', body: formData });
                const data = await resp.json();
                addLog('Upload started for ' + data.clips + ' clips', 'success');
            } catch (err) {
                addLog('Upload error: ' + err.message, 'error');
                document.getElementById('btnUpload').disabled = false;
            }
        }

        function downloadAll() {
            if (!currentJobId) return;
            window.open(`/api/download-all/${currentJobId}`, '_blank');
        }
    </script>
</body>
</html>
